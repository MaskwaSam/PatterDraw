name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 22.13.0

jobs:
  audit-and-check:
    name: Audit and check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: test "$(node --version)" = "v${NODE_VERSION}"
      - run: npm install --global npm@11.12.1 --ignore-scripts --no-audit --no-fund
      - run: test "$(npm --version)" = "11.12.1"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check

  browser-dev:
    name: Development browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: test "$(node --version)" = "v${NODE_VERSION}"
      - run: npm install --global npm@11.12.1 --ignore-scripts --no-audit --no-fund
      - run: test "$(npm --version)" = "11.12.1"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload development browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patterdraw-browser-dev-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  browser-production:
    name: Packaged production browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Final packaging checks the real local origin/main tracking ref.
          # PR merge commits remain explicitly development-only below.
          fetch-depth: 0
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: test "$(node --version)" = "v${NODE_VERSION}"
      - run: npm install --global npm@11.12.1 --ignore-scripts --no-audit --no-fund
      - run: test "$(npm --version)" = "11.12.1"
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - id: production-build
        name: Build and record production manifest
        run: |
          set -o pipefail
          production_diag_dir="$RUNNER_TEMP/patterdraw-production"
          mkdir -p "$production_diag_dir"
          npm run build 2>&1 | tee "$production_diag_dir/build.log"
          if [ -d dist ]; then
            find dist -type f -print | sort > "$production_diag_dir/dist-manifest.txt"
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$production_diag_dir/dist-sha256.txt"
          else
            : > "$production_diag_dir/dist-manifest.txt"
            : > "$production_diag_dir/dist-sha256.txt"
          fi
      - id: production-package
        name: Package and verify release artifact
        if: ${{ always() && steps.production-build.outcome == 'success' }}
        run: |
          set -o pipefail
          production_diag_dir="$RUNNER_TEMP/patterdraw-production"
          release_preparation_args=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            release_preparation_args+=(--allow-unpushed-development)
          fi
          printf 'stale build probe\n' > dist/stale-release-probe.js
          npm run release:package -- "${release_preparation_args[@]}" 2>&1 | tee "$production_diag_dir/package.log"
          test ! -e dist/stale-release-probe.js
          test ! -e dist/release/stale-release-probe.js
          sha256sum dist/release/release-manifest.json dist/release/provenance.json dist/release/sbom.cdx.json dist/release/SHA256SUMS > "$production_diag_dir/release-first.sha256"
          npm run release:package -- "${release_preparation_args[@]}" 2>&1 | tee "$production_diag_dir/package-repeat.log"
          sha256sum dist/release/release-manifest.json dist/release/provenance.json dist/release/sbom.cdx.json dist/release/SHA256SUMS > "$production_diag_dir/release-second.sha256"
          diff -u "$production_diag_dir/release-first.sha256" "$production_diag_dir/release-second.sha256"
          npm run release:verify -- "${release_preparation_args[@]}" 2>&1 | tee "$production_diag_dir/package-verify.log"
      - name: Prepare production diagnostics
        if: ${{ always() }}
        run: |
          production_diag_dir="$RUNNER_TEMP/patterdraw-production"
          mkdir -p artifacts/production
          if [ -d "$production_diag_dir" ]; then
            cp -f "$production_diag_dir"/* artifacts/production/ 2>/dev/null || true
          fi
          if [ -d dist/release ]; then
            find dist/release -type f -print | sort > artifacts/production/release-manifest-files.txt
          fi
      - id: production-container
        name: Build and smoke-test deployment container
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.production-package.outcome == 'success' }}
        run: |
          set -euo pipefail
          deploy_env="$RUNNER_TEMP/patterdraw-deploy.env"
          deploy_project="patterdraw-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          edge_network="patterdraw_edge"
          network_created=0
          cleanup() {
            set +e
            docker compose --project-name "$deploy_project" --env-file "$deploy_env" \
              -f deploy/compose.yaml down --remove-orphans >/dev/null 2>&1
            if [ "$network_created" = 1 ]; then
              docker network rm "$edge_network" >/dev/null 2>&1
            fi
          }
          trap cleanup EXIT

          node deploy/verify-config.mjs | tee artifacts/production/deploy-verify.log
          sed -n \
            -e '/^PATTERDRAW_GIT_COMMIT=/p' \
            -e '/^PATTERDRAW_MANIFEST_SHA256=/p' \
            -e '/^PATTERDRAW_RELEASE_TREE_SHA256=/p' \
            -e '/^PATTERDRAW_DEPLOY_CONFIG_SHA256=/p' \
            -e '/^PATTERDRAW_IMAGE_TAG=/p' \
            artifacts/production/deploy-verify.log > "$deploy_env"
          test "$(wc -l < "$deploy_env" | tr -d '[:space:]')" = 5
          chmod 0600 "$deploy_env"
          set -a
          . "$deploy_env"
          set +a

          docker compose --project-name "$deploy_project" --env-file "$deploy_env" \
            -f deploy/compose.yaml config --quiet
          docker compose --project-name "$deploy_project" --env-file "$deploy_env" \
            -f deploy/compose.yaml build --pull patterdraw 2>&1 \
            | tee artifacts/production/deploy-build.log
          docker network create "$edge_network" > artifacts/production/deploy-network.id
          network_created=1
          docker compose --project-name "$deploy_project" --env-file "$deploy_env" \
            -f deploy/compose.yaml up -d --no-deps --no-build --wait patterdraw

          container_id=$(docker compose --project-name "$deploy_project" --env-file "$deploy_env" \
            -f deploy/compose.yaml ps -q patterdraw)
          test -n "$container_id"
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "101:101"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container_id")" = "true"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy"
          test -z "$(docker port "$container_id")"
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$container_id" | grep -q '"ALL"'
          docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$container_id" | grep -q 'no-new-privileges'
          docker inspect --format '{{json .HostConfig.Tmpfs}}' "$container_id" | grep -q '/var/cache/nginx'
          test "$(docker inspect --format '{{len .NetworkSettings.Networks}}' "$container_id")" = 1
          test -n "$(docker inspect --format '{{(index .NetworkSettings.Networks "patterdraw_edge").NetworkID}}' "$container_id")"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$container_id")" = "$PATTERDRAW_GIT_COMMIT"
          test "$(docker inspect --format '{{index .Config.Labels "ca.spatterson.patterdraw.manifest-sha256"}}' "$container_id")" = "$PATTERDRAW_MANIFEST_SHA256"
          test "$(docker inspect --format '{{index .Config.Labels "ca.spatterson.patterdraw.release-tree-sha256"}}' "$container_id")" = "$PATTERDRAW_RELEASE_TREE_SHA256"
          test "$(docker inspect --format '{{index .Config.Labels "ca.spatterson.patterdraw.deploy-config-sha256"}}' "$container_id")" = "$PATTERDRAW_DEPLOY_CONFIG_SHA256"

          image_ref="patterdraw:${PATTERDRAW_IMAGE_TAG}"
          client=(docker run --rm --network "$edge_network" --entrypoint /bin/sh "$image_ref")
          "${client[@]}" -eu -c \
            'test "$(wget -q -O - --header="Host: draw.spatterson.ca" http://patterdraw:8080/healthz)" = healthy'
          "${client[@]}" -eu -c \
            'wget -q -O /tmp/patterdraw-index.html --header="Host: draw.spatterson.ca" http://patterdraw:8080/ && cmp /tmp/patterdraw-index.html /usr/share/nginx/html/index.html'
          "${client[@]}" -c \
            'wget -S -O /dev/null --header="Host: draw.spatterson.ca" http://patterdraw:8080/ 2>&1' \
            > artifacts/production/deploy-root-headers.txt
          expected_headers=(
            "Content-Security-Policy: default-src 'self' blob: data:; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob: data:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
            "Cross-Origin-Opener-Policy: same-origin"
            "Cross-Origin-Resource-Policy: same-origin"
            "Permissions-Policy: accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
            "Referrer-Policy: no-referrer"
            "Strict-Transport-Security: max-age=31536000"
            "X-Content-Type-Options: nosniff"
            "X-Frame-Options: DENY"
            "X-PatterDraw-Production-Dist: 1"
          )
          assert_security_headers() {
            local header_file="$1"
            for expected_header in "${expected_headers[@]}"; do
              grep -Fqi "$expected_header" "$header_file"
            done
          }
          assert_security_headers artifacts/production/deploy-root-headers.txt
          grep -qi 'Cache-Control: no-store' artifacts/production/deploy-root-headers.txt
          grep -qi 'Cache-Control: no-store, no-transform' artifacts/production/deploy-root-headers.txt
          grep -qi 'X-PatterDraw-App-Shell: patterdraw-app-shell-v1' artifacts/production/deploy-root-headers.txt

          for html_path in /index.html /classroom/deployment-acceptance; do
            "${client[@]}" -c \
              "wget -S -O /dev/null --header='Host: draw.spatterson.ca' 'http://patterdraw:8080$html_path' 2>&1" \
              > artifacts/production/deploy-html-route-headers.txt
            grep -q 'HTTP/1.1 200' artifacts/production/deploy-html-route-headers.txt
            assert_security_headers artifacts/production/deploy-html-route-headers.txt
            grep -qi 'Cache-Control: no-store, no-transform' \
              artifacts/production/deploy-html-route-headers.txt
            grep -qi 'X-PatterDraw-App-Shell: patterdraw-app-shell-v1' \
              artifacts/production/deploy-html-route-headers.txt
          done

          "${client[@]}" -eu -c \
            'printf "POST / HTTP/1.1\r\nHost: draw.spatterson.ca\r\nContent-Length: 0\r\nConnection: close\r\n\r\n" | nc -w 5 patterdraw 8080' \
            > artifacts/production/deploy-method-headers.txt
          grep -q 'HTTP/1.1 405' artifacts/production/deploy-method-headers.txt
          grep -qi 'Allow: GET, HEAD' artifacts/production/deploy-method-headers.txt
          assert_security_headers artifacts/production/deploy-method-headers.txt
          grep -qi 'Cache-Control: no-store' artifacts/production/deploy-method-headers.txt

          "${client[@]}" -eu -c \
            'printf "GET /assets/missing-does-not-exist.js HTTP/1.1\r\nHost: draw.spatterson.ca\r\nConnection: close\r\n\r\n" | nc -w 5 patterdraw 8080' \
            > artifacts/production/deploy-missing-headers.txt
          grep -q 'HTTP/1.1 404' artifacts/production/deploy-missing-headers.txt
          assert_security_headers artifacts/production/deploy-missing-headers.txt
          grep -qi 'Cache-Control: no-store' \
            artifacts/production/deploy-missing-headers.txt

          if "${client[@]}" -c \
            'wget -q -O /dev/null --header="Host: invalid.example" http://patterdraw:8080/'; then
            echo "Unknown Host unexpectedly received a usable response." >&2
            exit 1
          fi

          asset_path=$(find dist/release/assets -type f -print | LC_ALL=C sort \
            | sed -n '1p' | sed 's#^dist/release/##')
          test -n "$asset_path"
          "${client[@]}" -c \
            "wget -S -O /dev/null --header='Host: draw.spatterson.ca' 'http://patterdraw:8080/$asset_path' 2>&1" \
            > artifacts/production/deploy-asset-headers.txt
          grep -qi 'Cache-Control: public, max-age=31536000, immutable' \
            artifacts/production/deploy-asset-headers.txt

          "${client[@]}" -c \
            'wget -S -O /dev/null --header="Host: draw.spatterson.ca" http://patterdraw:8080/geogon/index.html 2>&1' \
            > artifacts/production/deploy-geogon-headers.txt
          grep -q 'HTTP/1.1 200' artifacts/production/deploy-geogon-headers.txt
          grep -Fqi "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'none'; media-src 'none'; frame-src 'self'; object-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" \
            artifacts/production/deploy-geogon-headers.txt
          grep -Fqi 'X-Frame-Options: SAMEORIGIN' artifacts/production/deploy-geogon-headers.txt
          grep -Fqi 'Cache-Control: no-store, no-transform' artifacts/production/deploy-geogon-headers.txt

          mapfile -t pdf_workers < <(find dist/release/assets -maxdepth 1 -type f \
            -name 'pdf.worker*.mjs' -print | LC_ALL=C sort)
          test "${#pdf_workers[@]}" -eq 1
          pdf_worker_path=${pdf_workers[0]#dist/release/}
          "${client[@]}" -c \
            "wget -S -O /dev/null --header='Host: draw.spatterson.ca' 'http://patterdraw:8080/$pdf_worker_path?patterdraw-worker=mjs-mime-v1' 2>&1" \
            > artifacts/production/deploy-pdf-worker-headers.txt
          grep -q 'HTTP/1.1 200' artifacts/production/deploy-pdf-worker-headers.txt
          assert_security_headers artifacts/production/deploy-pdf-worker-headers.txt
          grep -Eqi '^[[:space:]]*Content-Type:[[:space:]]*application/javascript([[:space:]]*;.*)?[[:space:]]*$' \
            artifacts/production/deploy-pdf-worker-headers.txt
          grep -Eqi '^[[:space:]]*Cache-Control:[[:space:]]*public, max-age=31536000, immutable[[:space:]]*$' \
            artifacts/production/deploy-pdf-worker-headers.txt

          "${client[@]}" -eu -c \
            'wget -S -O /tmp/patterdraw-service-worker.js --header="Host: draw.spatterson.ca" http://patterdraw:8080/service-worker.js && cmp /tmp/patterdraw-service-worker.js /usr/share/nginx/html/service-worker.js' \
            > artifacts/production/deploy-service-worker-headers.txt 2>&1
          grep -q 'HTTP/1.1 200' artifacts/production/deploy-service-worker-headers.txt
          assert_security_headers artifacts/production/deploy-service-worker-headers.txt
          grep -Eqi '^[[:space:]]*Content-Type:[[:space:]]*application/javascript([[:space:]]*;.*)?[[:space:]]*$' \
            artifacts/production/deploy-service-worker-headers.txt
          grep -Eqi '^[[:space:]]*Cache-Control:[[:space:]]*no-store, no-transform[[:space:]]*$' \
            artifacts/production/deploy-service-worker-headers.txt
      - name: Start packaged release server
        if: ${{ always() && steps.production-package.outcome == 'success' }}
        run: |
          set -euo pipefail
          node scripts/serve-production-dist.mjs --dist dist/release --host 127.0.0.1 --port 4174 > artifacts/production/server.log 2>&1 &
          server_pid=$!
          echo "$server_pid" > artifacts/production/server.pid
          expected_manifest_sha=$(sha256sum dist/release/release-manifest.json | awk '{print $1}')
          printf '%s\n' "$expected_manifest_sha" > artifacts/production/expected-release-manifest.sha256
          # Give an EADDRINUSE failure time to terminate before any existing
          # listener can satisfy the HTTP readiness probe.
          sleep 1
          for attempt in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat artifacts/production/server.log
              echo "The recorded packaged release server exited before readiness." >&2
              exit 1
            fi
            if curl --fail --silent --show-error \
              http://127.0.0.1:4174/classroom/math/unit-01/patterdraw/release-manifest.json \
              --output artifacts/production/served-release-manifest.json; then
              served_manifest_sha=$(sha256sum artifacts/production/served-release-manifest.json | awk '{print $1}')
              if [ "$served_manifest_sha" != "$expected_manifest_sha" ]; then
                echo "The listening server does not match the packaged release manifest." >&2
                exit 1
              fi
              kill -0 "$server_pid"
              exit 0
            fi
            sleep 1
          done
          cat artifacts/production/server.log
          exit 1
      - id: production-browser
        name: Run production browser evidence
        if: ${{ always() && steps.production-package.outcome == 'success' }}
        run: |
          set -euo pipefail
          server_pid=$(cat artifacts/production/server.pid)
          expected_manifest_sha=$(cat artifacts/production/expected-release-manifest.sha256)
          verify_served_release() {
            phase=$1
            kill -0 "$server_pid"
            curl --fail --silent --show-error \
              http://127.0.0.1:4174/classroom/math/unit-01/patterdraw/release-manifest.json \
              --output "artifacts/production/served-release-manifest-${phase}.json"
            served_manifest_sha=$(sha256sum "artifacts/production/served-release-manifest-${phase}.json" | awk '{print $1}')
            test "$served_manifest_sha" = "$expected_manifest_sha"
          }
          verify_served_release before-browser
          browser_status=0
          PW_PRODUCTION_REUSE_SERVER=1 npm run test:browser:production || browser_status=$?
          verify_served_release after-browser
          exit "$browser_status"
      - id: production-postverify
        name: Verify browser tests preserved the release artifact
        if: ${{ always() && steps.production-package.outcome == 'success' }}
        run: |
          release_preparation_args=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            release_preparation_args+=(--allow-unpushed-development)
          fi
          npm run release:verify -- "${release_preparation_args[@]}" 2>&1 \
            | tee artifacts/production/release-postverify.log
      - name: Stop packaged release server
        if: ${{ always() }}
        run: |
          if [ -s artifacts/production/server.pid ]; then
            kill "$(cat artifacts/production/server.pid)" 2>/dev/null || true
          fi
      - name: Upload production browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patterdraw-browser-production-${{ github.run_id }}
          path: |
            test-results/production/
            playwright-report/production/
            artifacts/production/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified production release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.production-package.outcome == 'success' && steps.production-container.outcome == 'success' && steps.production-browser.outcome == 'success' && steps.production-postverify.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patterdraw-release-${{ github.run_id }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
