worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    default_type application/octet-stream;

    access_log /dev/stdout combined;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 1m;

    client_body_temp_path /var/cache/nginx/client_temp 1 2;
    proxy_temp_path /var/cache/nginx/proxy_temp 1 2;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp 1 2;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp 1 2;
    scgi_temp_path /var/cache/nginx/scgi_temp 1 2;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        return 444;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name draw.spatterson.ca;

        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
        etag on;

        include /etc/nginx/includes/patterdraw-security.conf;

        # Reject encoded traversal and path separators before URI normalization.
        if ($request_uri ~* "%00|%2e|%2f|%5c") {
            return 404;
        }

        # A named error target adds the standards-required Allow header without
        # weakening the security headers inherited by ordinary responses.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 418;
        }
        error_page 418 = @method_not_allowed;

        location @method_not_allowed {
            include /etc/nginx/includes/patterdraw-security.conf;
            add_header Allow "GET, HEAD" always;
            add_header Cache-Control "no-store" always;
            return 405;
        }

        location = /healthz {
            include /etc/nginx/includes/patterdraw-security.conf;
            add_header Cache-Control "no-store" always;
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location = / {
            include /etc/nginx/includes/patterdraw-security.conf;
            # no-transform prevents proxy-side script injection (including
            # analytics beacons) into the offline-only student application.
            add_header Cache-Control "no-store, no-transform" always;
            try_files /index.html =404;
        }

        location = /index.html {
            include /etc/nginx/includes/patterdraw-security.conf;
            add_header Cache-Control "no-store, no-transform" always;
            try_files $uri =404;
        }

        # GeoGon is a reviewed, pinned local subapplication. Its HTML needs an
        # inline import map, but only this path may be embedded by PatterDraw.
        # Keep these headers explicit: any add_header in a location prevents
        # inheritance of the server-level add_header policy in NGINX.
        location = /geogon/index.html {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'none'; media-src 'none'; frame-src 'self'; object-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-PatterDraw-Production-Dist "1" always;
            add_header Cache-Control "no-store, no-transform" always;
            error_page 404 = @asset_not_found;
            try_files $uri =404;
        }

        location ^~ /geogon/ {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'none'; media-src 'none'; frame-src 'self'; object-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-PatterDraw-Production-Dist "1" always;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            error_page 404 = @asset_not_found;
            if ($uri ~ /$) {
                return 404;
            }
            try_files $uri =404;
        }

        location @asset_not_found {
            include /etc/nginx/includes/patterdraw-security.conf;
            # no-store survives zone-level browser TTL overrides and prevents
            # a transient deployment miss from being retained at the edge.
            add_header Cache-Control "no-store" always;
            return 404;
        }

        location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.[^/]+$" {
            include /etc/nginx/includes/patterdraw-security.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            error_page 404 = @asset_not_found;
            try_files $uri =404;
        }

        location ~ (^|/)\. {
            include /etc/nginx/includes/patterdraw-security.conf;
            add_header Cache-Control "no-store" always;
            return 404;
        }

        location ~* "^/(?:assets|excalidraw-assets|licenses|mathjax|mathjax-fonts|pdfjs)/" {
            include /etc/nginx/includes/patterdraw-security.conf;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            if ($uri ~ /$) {
                return 404;
            }
            try_files $uri =404;
        }

        location ~* "^/(?:provenance|release-manifest|sbom\.cdx)\.json$" {
            include /etc/nginx/includes/patterdraw-security.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        location = /SHA256SUMS {
            include /etc/nginx/includes/patterdraw-security.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        location @patterdraw_app {
            include /etc/nginx/includes/patterdraw-security.conf;
            add_header Cache-Control "no-store, no-transform" always;
            try_files /index.html =404;
        }

        location / {
            include /etc/nginx/includes/patterdraw-security.conf;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            if ($uri ~ "\.[^/]+$") {
                return 404;
            }
            try_files $uri @patterdraw_app;
        }
    }
}
